project_id = "project-leafy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "https://auth.projectleafy.app/auth/callback"
additional_redirect_urls = ["https://auth.projectleafy.app/auth/**", "https://admin.projectleafy.app/**", "https://leafy-catalog-admin.rahsanlewis.chatgpt.site/**", "leafy://auth/**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.apple]
enabled = true
client_id = "com.beyondsolid.projectleafy"
secret = ""

# JWT-only live functions: gateway verification is defense in depth. Each
# function still independently calls auth.getUser() and never trusts caller IDs.
[functions.save-nutrition-plan]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.discover-food-product]
verify_jwt = true

[functions.estimate-meal]
verify_jwt = true

[functions.nutrition-chat]
verify_jwt = true

[functions.daily-nutrition]
verify_jwt = true

[functions.manage-food-entry]
verify_jwt = true

[functions.manage-legal-acceptance]
verify_jwt = true

# Intentional verify_jwt = false exceptions (documented in docs/catalog-contribution-security.md):
# CATALOG_REVIEW_KEY without a user JWT (CLI / internal admin_retry).
[functions.manage-catalog-contribution]
verify_jwt = false

[functions.review-catalog-contribution]
verify_jwt = false

# Retired tombstones must return 410 to older clients that may not send a user JWT.
[functions.manage-data-contribution]
verify_jwt = false

[functions.transcribe-meal-audio]
verify_jwt = false

[functions.weight-fluctuation-context]
verify_jwt = false
