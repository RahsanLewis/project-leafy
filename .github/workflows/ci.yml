name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-read scripts/generate-nutrient-catalog.ts --check
      - run: deno check supabase/functions/*/index.ts
      - run: deno test --allow-read supabase/tests

  ios-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild test -project Leafy.xcodeproj -scheme Leafy -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.2' -only-testing:LeafyTests CODE_SIGNING_ALLOWED=NO
