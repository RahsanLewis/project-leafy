name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-read supabase/tests

  ios-ui-tests:
    # LEAFY-027: keep the complete suite as a post-merge/manual soft-fail signal until
    # its known failures are fixed or explicitly quarantined.
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Select a concrete iPhone simulator destination
        run: python3 scripts/select-ios-simulator.py
      - name: Run complete LeafyUITests suite
        run: >
          xcodebuild test
          -project Leafy.xcodeproj
          -scheme Leafy
          -only-testing:LeafyUITests
          -destination "$IOS_TEST_DESTINATION"
          CODE_SIGNING_ALLOWED=NO
          -resultBundlePath LeafyUITests.xcresult
      - name: Extract UI test screenshot attachments
        if: always()
        run: |
          mkdir -p ui-test-screenshots
          xcrun xcresulttool export attachments \
            --path LeafyUITests.xcresult \
            --output-path ui-test-screenshots \
            2>&1 | tee ui-test-screenshots/extract.log
          python3 <<'PY'
          import re
          from pathlib import Path

          root = Path("ui-test-screenshots")
          log = (root / "extract.log").read_text(errors="replace")
          renamed = 0
          for file_id, suggested in re.findall(
              r'File: ([^,]+), suggested name: "([^"]+)"',
              log,
          ):
              src = root / file_id.strip()
              if not src.exists():
                  continue
              name = Path(suggested).name
              dest = root / name
              if dest.exists() and dest != src:
                  dest = root / f"{src.stem}-{name}"
              src.rename(dest)
              renamed += 1
          print(f"Renamed {renamed} exported attachments to suggested names")
          pngs = sorted(p.name for p in root.glob("*.png"))
          print("PNG files:\n" + "\n".join(pngs) if pngs else "No PNG files were exported")
          PY
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leafy-uitest-results
          path: |
            LeafyUITests.xcresult
            ui-test-screenshots/
